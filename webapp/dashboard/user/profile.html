<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="user.css">
  <link rel="icon" href="../images/logo1.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <h2 class="logo">EventHub</h2>

    <!-- -------------------sidebar actions------------------- -->
    <ul class="menu">
      <li>
        <a href="user.html">
        <i class="fa-regular fa-calendar"></i>
      My Dashboard</a></li>

      <li >
        <a href="browse.html">
        <i class="fa-solid fa-magnifying-glass"></i>
        Browse Events </a></li>

      <li><a href="tickets.html">
        <i class="fa-solid fa-ticket"></i>
        My Tickets</a></li>

      <li>
       <a href="bookings.html"> <i class="fa-regular fa-file"></i>
        My Bookings</a></li>
<li>
        <a href="calendar.html"><i class="fa-regular fa-calendar-days"></i>
        Event Calendar</a></li>

      <li class="active">
       <a href="profile.html"><i class="fa-regular fa-circle-user"></i>
        Profile Settings</a></li>

      <li>
        <a href="support.html"><i class="fa-regular fa-circle-question"></i>
        Help & Support</a></li>
    </ul>

   
    <div class="user">

  <div class="user-info">
    <img src="https://i.pravatar.cc/40" alt="User avatar" data-user-avatar>

    <div class="user-text">
      <strong id="sidebarUserName" data-user-name>EventHub User</strong>
      <span>Event Attendee</span>
    </div>
  </div>

  <a href="/logout" class="logout">
    <i class="fa-solid fa-right-from-bracket"></i>
  </a>

</div>
  </aside>


  <!-- ----------------Main Content---------------- -->
  <main class="main browse-main">
    <header class="topbar">

      <button class="menu-toggle" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</button>
      <h2>My Dashboard</h2>

      <div class="top-actions">
        <input type="text" placeholder="Search Events..." class="searchbox">
        <button class="primary-btn">Browse Events</button>
        <img class="avatar" src="https://i.pravatar.cc/40" alt="User avatar" data-user-avatar>
      </div>
    </header>

    <!----------------- section ----------------->
   <section class="profile-settings">

<div class="profile-grid">

<!-- PROFILE CARD -->
 
<div class="profile-card">
<img src="../images/logo1.png" class="profile-img" data-user-avatar>

<h3 data-user-name>EventHub User</h3>
<span class="role" data-user-role>Event Attendee</span>

<p class="img-note">JPG / PNG • Max 2MB</p>

<button class="upload-btn">Upload Photo</button>
<input type="file" id="profileImageInput" accept="image/jpeg,image/png,image/jpg" hidden>

</div>


<!-- RIGHT SIDE -->

<div class="right-section">

<!-- PERSONAL INFO -->

<div class="profile-form">

<h2>Personal Information</h2>

<form class="form-grid" id="profileDetailsForm">

<div class="field">
<label>First Name</label>
<input type="text" value="" id="profileFirstName" name="firstName" data-user-first-name>
</div>

<div class="field">
<label>Last Name</label>
<input type="text" value="" id="profileLastName" name="lastName" data-user-last-name>
</div>

<div class="field full">
<label>Email</label>
<input type="email" value="" id="profileEmail" name="email" data-user-email disabled>
</div>

<div class="field">
<label>Phone</label>
<input type="tel" id="profilePhone" name="phone">
</div>

<div class="field">
<label>Role</label>

<select class="dropdown" id="profileRole" name="role" data-user-role>
<option value="user">User</option>
</select>

</div>

<div class="field full">
<label>Bio</label>
<textarea rows="4" id="profileBio" name="bio"></textarea>
</div>

</form>

<div class="form-btns">
<button class="cancel" type="button" id="profileCancelBtn">Cancel</button>
<button class="save" type="submit" form="profileDetailsForm" id="profileSaveBtn">Save Changes</button>
</div>
<p class="register-form-status" id="profileDetailsStatus" hidden></p>

</div>


<!-- PASSWORD SECTION -->

<div class="password-card">

<h2>Security</h2>

<form class="form-grid" id="profilePasswordForm">

<div class="field">
<label>Current Password</label>
<input type="password" id="profileCurrentPassword" name="currentPassword">
</div>

<div></div>

<div class="field">
<label>New Password</label>
<input type="password" id="profileNewPassword" name="newPassword">
</div>

<div class="field">
<label>Confirm Password</label>
<input type="password" id="profileConfirmPassword" name="confirmPassword">
</div>

</form>

<button class="update-pass" type="submit" form="profilePasswordForm" id="profilePasswordSaveBtn">Update Password</button>
<p class="register-form-status" id="profilePasswordStatus" hidden></p>

</div>

</div>

</div>

</section>


<!-- ------------------ -->
  </main>
</div>
</body>

<script src="user.js"></script>
</html>
