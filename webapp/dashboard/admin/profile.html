<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/dashboard/user/user.css">
  <link rel="stylesheet" href="/assets/dashboard/admin/admin.css">
  <link rel="icon" href="/assets/dashboard/images/logo1.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <h2 class="logo">EventHub</h2>

    <ul class="menu">
      <li>
        <a href="/dashboard/admin"><i class="fa-regular fa-calendar"></i>My Dashboard</a>
      </li>
      <li>
        <a href="/dashboard/admin?section=organizers"><i class="fa-solid fa-user-tie"></i>Manage Organizer</a>
      </li>
      <li>
        <a href="/dashboard/admin?section=users"><i class="fa-solid fa-users"></i>Manage User</a>
      </li>
      <li>
        <a href="/dashboard/admin?section=browse">
          <i class="fa-solid fa-magnifying-glass"></i>
          Browse
        </a>
      </li>
      <li>
        <a href="/dashboard/admin?section=subscriptions">
          <i class="fa-solid fa-layer-group"></i>
          Subscription Module
        </a>
      </li>
      <li>
        <a href="/dashboard/admin?section=payments">
          <i class="fa-solid fa-wallet"></i>
          Payment & Revenue
        </a>
      </li>
      <li class="active">
        <a href="/assets/dashboard/admin/profile.html"><i class="fa-regular fa-circle-user"></i>My Profile</a>
      </li>
      <li>
        <a href="/assets/dashboard/admin/support.html"><i class="fa-regular fa-circle-question"></i>Help & Support</a>
      </li>
    </ul>

    <div class="user">
      <div class="user-info">
        <img src="/assets/dashboard/images/logo1.png" alt="Admin avatar" data-user-avatar>
        <div class="user-text">
          <strong id="sidebarUserName" data-user-name>EventHub Admin</strong>
          <span data-user-role>Platform Administrator</span>
        </div>
      </div>

      <a href="/logout" class="logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </div>
  </aside>

  <main class="main browse-main">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h2>Admin Profile</h2>

      <div class="top-actions">
        <input type="text" placeholder="Search organizers, users, events..." class="searchbox">
        <button class="primary-btn" onclick="window.location.href='/dashboard/admin'">Open Panel</button>
        <button class="admin-theme-toggle" type="button" id="adminThemeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <i class="fa-regular fa-moon" id="adminThemeDarkIcon"></i>
          <i class="fa-regular fa-sun hidden" id="adminThemeLightIcon"></i>
        </button>
        <img class="avatar topbar-profile-link" src="/assets/dashboard/images/logo1.png" alt="Admin avatar" data-user-avatar onclick="window.location.href='/assets/dashboard/admin/profile.html'">
      </div>
    </header>

    <section class="profile-settings">
      <div class="profile-grid">
        <div class="profile-card">
          <img src="/assets/dashboard/images/logo1.png" class="profile-img" alt="Admin profile photo" data-user-avatar>
          <h3 data-user-name>EventHub Admin</h3>
          <span class="role" data-user-role>Admin</span>
          <p class="img-note">JPG / PNG • Max 2MB</p>
          <button class="upload-btn" type="button">Upload Photo</button>
          <button type="button" class="remove-photo-btn" id="removeProfileImageBtn">Remove Photo</button>
          <input type="file" id="profileImageInput" accept="image/jpeg,image/png,image/jpg" hidden>
        </div>

        <div class="right-section">
          <div class="profile-form">
            <h2>Personal Information</h2>

            <form class="form-grid" id="profileDetailsForm">
              <div class="field">
                <label>First Name</label>
                <input type="text" value="" id="profileFirstName" name="firstName" data-user-first-name>
              </div>

              <div class="field">
                <label>Last Name</label>
                <input type="text" value="" id="profileLastName" name="lastName" data-user-last-name>
              </div>

              <div class="field full">
                <label>Email</label>
                <input type="email" value="" id="profileEmail" name="email" data-user-email disabled>
              </div>

              <div class="field">
                <label>Phone</label>
                <input type="tel" id="profilePhone" name="phone">
              </div>

              <div class="field">
                <label>Role</label>
                <select class="dropdown" id="profileRole" name="role" data-user-role>
                  <option value="admin">Admin</option>
                </select>
              </div>

              <div class="field full">
                <label>Bio</label>
                <textarea rows="4" id="profileBio" name="bio"></textarea>
              </div>
            </form>

            <div class="form-btns">
              <button class="cancel" type="button" id="profileCancelBtn">Cancel</button>
              <button class="save" type="submit" form="profileDetailsForm" id="profileSaveBtn">Save Changes</button>
            </div>
            <p class="register-form-status" id="profileDetailsStatus" hidden></p>
          </div>

          <div class="password-card">
            <h2>Security</h2>

            <form class="form-grid" id="profilePasswordForm">
              <div class="field">
                <label>Current Password</label>
                <input type="password" id="profileCurrentPassword" name="currentPassword">
              </div>

              <div></div>

              <div class="field">
                <label>New Password</label>
                <input type="password" id="profileNewPassword" name="newPassword">
              </div>

              <div class="field">
                <label>Confirm Password</label>
                <input type="password" id="profileConfirmPassword" name="confirmPassword">
              </div>
            </form>

            <button class="update-pass" type="submit" form="profilePasswordForm" id="profilePasswordSaveBtn">Update Password</button>
            <p class="register-form-status" id="profilePasswordStatus" hidden></p>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
<script src="/assets/dashboard/admin/admin-theme.js"></script>
<script src="/assets/dashboard/user/user.js"></script>
</html>
