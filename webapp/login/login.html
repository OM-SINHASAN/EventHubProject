<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | EventHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/login/login.css">
  <link rel="icon" href="/assets/home/logo1.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-info">
        <h2>Welcome Back</h2>
        <p>
          Login to manage your events, explore new experiences,
          and stay connected with EventHub.
        </p>
      </div>

      <div class="auth-form">
        <h3>Login</h3>
        <div class="{{STATUS_CLASS}}">{{STATUS_MESSAGE}}</div>

        <form action="/login" method="POST">
          <input type="email" name="email" placeholder="Email Address" value="{{EMAIL_VALUE}}" required>
          <div class="password-field">
            <input type="password" name="password" id="loginPassword" placeholder="Password" required>
            <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>

          <button type="submit">Login</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="/register">Register</a>
        </p>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll(".password-toggle").forEach(toggleButton => {
      toggleButton.addEventListener("click", () => {
        const targetInput = document.getElementById(toggleButton.dataset.target);

        if (!targetInput) {
          return;
        }

        const isPassword = targetInput.type === "password";
        targetInput.type = isPassword ? "text" : "password";
        toggleButton.innerHTML = isPassword
          ? '<i class="fa-regular fa-eye"></i>'
          : '<i class="fa-regular fa-eye-slash"></i>';
        toggleButton.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
      });
    });
  </script>
</body>
</html>
